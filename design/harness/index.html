<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>待办面板 · 本地预览</title>
<style>
/* 取自 DSH 运行时的真实 token 值（由面板自检上报） */
:root{
  --dsw-alias-bg-base:#fff;
  --dsw-alias-bg-layer-1:#fff;
  --dsw-alias-bg-layer-2:#fff;
  --dsw-alias-bg-overlay:#e9ecf2;
  --dsw-alias-border-l1:#0000000a;
  --dsw-alias-border-l2:#0000001a;
  --dsw-alias-label-primary:#0f1115;
  --dsw-alias-label-secondary:#61666b;
  --dsw-alias-brand-primary:#0f1115;
  --dsw-alias-state-success-primary:#22c55e;
  --dsw-alias-state-error-primary:#ec1313;
  --dsw-alias-state-warn-primary:#f59e0b;
  --dsw-alias-state-idle-primary:#d4d4d4;
  --dsw-specific-sidebar-fill:#f9fafb;
}
html,body{margin:0;height:100%;background:var(--dsw-alias-bg-base)}
body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;color:var(--dsw-alias-label-primary)}
#root{height:100%}
</style>
</head>
<body>
<div id="root"></div>
<script>
  window.addEventListener('error', function (e) {
    var el = document.createElement('pre');
    el.id = 'err';
    el.style.cssText = 'color:#c00;white-space:pre-wrap;padding:16px;font-size:12px';
    el.textContent = 'ERROR: ' + (e.message || e) + '\n' + (e.filename || '') + ':' + (e.lineno || '');
    document.body.appendChild(el);
  });
</script>

<script src="./node_modules/react/umd/react.production.min.js"></script>
<script src="./node_modules/react-dom/umd/react-dom.production.min.js"></script>
<script src="./mock.js"></script>
<script>
/* 模拟 DSH 的 client 模块加载器，把 bundle/client.js 原样跑起来 */
window.__ModuleLoader__ = {
  load(def) {
    const mod = def.factory((name) => (name === 'react' ? window.React : undefined));
    const captured = {};
    const ctx = {
      effect(fn) { const d = fn(); return () => (typeof d === 'function' ? d() : undefined); },
      slots: {
        inject(key, cb) { cb(); return () => {}; },
        register(reg, comp) { captured[reg.name] = comp; return () => {}; },
      },
    };
    mod.apply(ctx);
    const Panel = captured.main;
    if (!Panel) { document.getElementById('root').textContent = 'panel 未注册'; return; }
    ReactDOM.render(React.createElement(Panel), document.getElementById('root'));
  },
};
</script>
<script src="../../client.js"></script>

<script>
/* 渲染后把关键计算样式写进 DOM，供 --dump-dom 读取 */
setTimeout(function () {
  if (location.hash.indexOf('draft') >= 0) {
    var ta = document.querySelector('.todo-textarea');
    if (ta) {
      var setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
      setter.call(ta, '明天下午三点跟王工对接口，周五前发报价单，另外抽空去趟银行');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      setTimeout(function () {
        var b = document.querySelector('.todo-send');
        if (b) b.click();
      }, 120);
    }
  }
  if (location.hash.indexOf('persona') >= 0) {
    var av = document.querySelector('.todo-ava-btn');
    if (av) av.click();
  }
  if (location.hash.indexOf('ann') >= 0) {
    var segs2 = document.querySelectorAll('.todo-head .todo-seg');
    var vseg = segs2[segs2.length - 1];
    if (vseg) { var cb = vseg.querySelectorAll('button')[1]; if (cb) cb.click(); }
    setTimeout(function () {
      var ab = document.querySelector('.todo-ann-btn');
      if (ab) ab.click();
      if (location.hash.indexOf('annform') >= 0) {
        setTimeout(function () {
          var add = document.querySelector('.todo-ann-add');
          if (add) add.click();
        }, 250);
      }
    }, 500);
  }
  if (location.hash.indexOf('tochat') >= 0) {
    var chatBtn = document.querySelector('.todo-row .todo-todel');
    if (chatBtn) chatBtn.click();
  }
  if (location.hash.indexOf('new') >= 0) {
    var addBtn = document.querySelector('.todo-add');
    if (addBtn) addBtn.click();
  }
  if (location.hash.indexOf('choose') >= 0) {
    var tries3 = 0;
    var iv3 = setInterval(function () {
      var b3 = document.querySelector('.todo-ask-btn');
      if (b3) { clearInterval(iv3); b3.click(); }
      else if (++tries3 > 90) clearInterval(iv3);
    }, 50);
  }
  if (location.hash.indexOf('dbl') >= 0) {
    var row0 = document.querySelector('.todo-row');
    if (row0) row0.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
    if (location.hash.indexOf('mod') >= 0) {
      setTimeout(function () {
        var inp0 = document.querySelector('.todo-edit-title');
        if (inp0) {
          var setter0 = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          setter0.call(inp0, '改过但没保存的标题');
          inp0.dispatchEvent(new Event('input', { bubbles: true }));
        }
        setTimeout(function () {
          /* 模拟点击编辑区以外 */
          document.body.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
        }, 250);
      }, 300);
    }
  }
  if (location.hash.indexOf('edit') >= 0) {
    var tt = document.querySelector('.todo-row .todo-t');
    if (tt) tt.click();
  }
  if (location.hash.indexOf('img') >= 0) {
    var cv = document.createElement('canvas');
    cv.width = 240; cv.height = 160;
    var gg = cv.getContext('2d');
    gg.fillStyle = '#e8ecf8'; gg.fillRect(0, 0, 240, 160);
    gg.fillStyle = '#4d6bfe'; gg.font = '16px sans-serif';
    gg.fillText('会议通知截图', 62, 84);
    cv.toBlob(function (blob) {
      var file = new File([blob], 'shot.png', { type: 'image/png' });
      var dt = new DataTransfer();
      dt.items.add(file);
      var ta = document.querySelector('.todo-textarea');
      if (ta) {
        ta.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
      }
      var tries = 0;
      var iv = setInterval(function () {
        var b = document.querySelector('.todo-send');
        if (b && !b.disabled) {
          clearInterval(iv);
          b.click();
          if (location.hash.indexOf('open') >= 0) {
            var tries2 = 0;
            var iv2 = setInterval(function () {
              var ims = document.querySelectorAll('.todo-msg-imgs img');
              var im = ims.length ? ims[ims.length - 1] : null;
              if (im) { clearInterval(iv2); im.click(); }
              else if (++tries2 > 60) clearInterval(iv2);
            }, 50);
          }
        } else if (++tries > 60) {
          clearInterval(iv);
        }
      }, 50);
    }, 'image/png');
  }
  if (location.hash.indexOf('collapse') >= 0) {
    var tools = document.querySelectorAll('.todo-tool');
    if (tools.length >= 4) tools[3].click();
  }
  if (location.hash.indexOf('search') >= 0) {
    var t2 = document.querySelectorAll('.todo-tool');
    if (t2.length >= 2) t2[1].click();
    setTimeout(function () {
      var inp = document.querySelector('.todo-search');
      if (inp) {
        var setter2 = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
        setter2.call(inp, '报价');
        inp.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }, 200);
  }
  if (location.hash.indexOf('help') >= 0) {
    var t = document.querySelector('.todo-tool[title="帮助"]');
    if (t) t.click();
  }
  if (location.hash.indexOf('create') >= 0) {
    setTimeout(function () {
      var d = location.hash.indexOf('nofill') >= 0 ? null : document.querySelector('.todo-field[data-miss="1"]');
      if (d) {
        var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
        setter.call(d, '2026-11-24');
        d.dispatchEvent(new Event('input', { bubbles: true }));
      }
      setTimeout(function () {
        var b = document.querySelector('.todo-btn-primary');
        if (b && !b.disabled) b.click();
      }, 250);
    }, 3400);
  }
  if (location.hash.indexOf('refill') >= 0) {
    setTimeout(function () {
      var d = document.querySelector('.todo-field[data-miss="1"]');
      if (d) {
        var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
        setter.call(d, '2026-11-25');
        d.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }, 4700);
  }
  if (location.hash.indexOf('cal') >= 0) {
    var segs = document.querySelectorAll('.todo-head .todo-seg');
    var viewSeg = segs[segs.length - 1];
    if (viewSeg) {
      var calBtn = viewSeg.querySelectorAll('button')[1];
      if (calBtn) calBtn.click();
    }
  }
  if (location.hash.indexOf('menu') >= 0) {
    var b = document.querySelector('.todo-model-btn');
    if (b) b.click();
    if (location.hash.indexOf('sub') >= 0) {
      setTimeout(function () {
        var row = document.querySelector('.todo-menu-row');
        if (row) row.click();
      }, 150);
    }
  }
  function cs(sel) {
    var el = document.querySelector(sel);
    return el ? getComputedStyle(el) : null;
  }
  var root = document.querySelector('.todo-root');
  var bar = cs('.todo-bar i');
  var track = cs('.todo-bar');
  var report = {
    rootTone: root ? root.getAttribute('data-tone') : null,
    accent: root ? getComputedStyle(root).getPropertyValue('--td-accent').trim() : null,
    chipBgVar: root ? getComputedStyle(root).getPropertyValue('--td-chip-bg').trim() : null,
    barFillWidth: bar ? bar.width : null,
    barFillBg: bar ? bar.backgroundColor : null,
    barTrackBg: track ? track.backgroundColor : null,
    barTrackW: track ? track.width : null,
    rowCount: document.querySelectorAll('.todo-row').length,
    /* 检查 ---dsw-alias-label-tertiary 是否真的存在 */
    varTertiary: (function () {
      var v = getComputedStyle(document.documentElement).getPropertyValue('--dsw-alias-label-tertiary');
      return v ? v.trim() : '(undefined)';
    })(),
    varSecondary: (function () {
      return getComputedStyle(document.documentElement).getPropertyValue('--dsw-alias-label-secondary').trim();
    })(),
    addColor: (cs('.todo-add') || {}).color || null,
    emptyColor: (cs('.todo-empty') || {}).color || null,
    doneRowColor: (cs('.todo-row[data-done="1"] .todo-t') || {}).color || null,
    doneRowDeco: (cs('.todo-row[data-done="1"] .todo-t') || {}).textDecorationLine || null,
  };
  var pre = document.createElement('pre');
  pre.id = 'diag';
  pre.style.display = 'none';
  pre.textContent = JSON.stringify(report);
  document.body.appendChild(pre);
}, 800);
</script>
</body>
</html>
